[flake8]
max-line-length = 160

[tool.pylint.master]
# Ignore any directory under */tests/ or */documentation/
ignore-paths = ["^.*/tests/.*$", "^.*documentation/.*$"]

[tool.pylint.basic]
extension-pkg-whitelist = "scipy"

[tool.pylint.format]
max-line-length = 160

[tool.pylint.messages_control]
disable = ["C0103", "E1101", "R1735", "C0209", "W0212"]
